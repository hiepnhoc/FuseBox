<!doctype html>
<!--
Fusebox dashboard. One operator panel for the proxy: the main line (endpoint and key),
the hour of load, every account's quota meters, live traffic, and what has tripped.
Design system: DESIGN.md. Warm near-black surfaces, IBM Plex Sans for text, Plex Sans
Condensed caps for labels, DM Mono for data, 20-segment quota meters, amber (#F3B52F)
only for the active tab, the live bar and the phone tab indicator.
Vanilla HTML/CSS/JS, embedded in the binary by src/server.rs. No build step and no
external requests: fonts, logos and icons are all served from /ui. When the binary is
built, /ui/ references here gain their file's version (?v=…, see build.rs) so browsers
may keep them until they change.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0b0b0a">
  <title>HiBox</title>
  <link rel="icon" href="/ui/icon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/ui/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="HiBox">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- The faces every page opens with: text, condensed capitals for labels, and data. -->
  <link rel="preload" href="/ui/fonts/ibm-plex-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/ui/fonts/ibm-plex-sans-condensed-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/ui/fonts/dm-mono-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/ui/style.css">
  <!-- Deferred: fetched while the page parses, run in this order once it has. -->
  <script defer src="/ui/i18n.js"></script>
  <script defer src="/ui/config.js"></script>
  <script defer src="/ui/usage.js"></script>
  <script defer src="/ui/app.js"></script>
</head>
<body>
  <!-- logos -->
  <a class="skip" href="#view">Skip to content</a>
  <header class="bar" id="bar">
    <a class="brand" href="#/overview" aria-label="HiBox overview">
      <span class="wordmark" aria-hidden="true"><span class="bkt">[</span>HiBox<span class="bkt">]</span></span>
      <svg class="mark" viewBox="0 0 48 56" aria-hidden="true" focusable="false"><path fill="#F3B52F" d="M0 0H16V8H8V48H16V56H0ZM48 0H32V8H40V48H32V56H48Z"/><path fill="currentColor" d="M16 24H32V32H16Z"/></svg>
    </a>
    <nav class="tabs" aria-label="Sections">
      <a href="#/overview" data-tab="overview">Overview</a>
      <a href="#/accounts" data-tab="accounts">Accounts</a>
      <a href="#/requests" data-tab="requests">Requests</a>
      <a href="#/usage" data-tab="usage">Usage</a>
      <a href="#/models" data-tab="models">Models</a>
      <a href="#/config" data-tab="config">Config</a>
    </nav>
    <span class="grow"></span>
    <button class="search" type="button" data-act="palette" aria-haspopup="dialog">
      <svg viewBox="0 0 14 14" aria-hidden="true"><circle cx="6" cy="6" r="4.25"/><path d="M9.2 9.2l3 3"/></svg>
      <span class="search-text">Search or run a command</span><kbd class="kbd" data-mod-key="K">⌘K</kbd>
    </button>
    <span class="faults-slot" data-faults-slot></span>
    <button class="icon-btn" type="button" data-act="privacy" data-privacy></button>
    <div class="live" data-live aria-live="polite"></div>
  </header>
  <header class="mbar" id="mbar"></header>
  <main id="view" class="view" tabindex="-1"></main>
  <nav class="mtabs" aria-label="Sections">
    <a href="#/overview" data-tab="overview"><i aria-hidden="true"></i>Overview</a>
    <a href="#/accounts" data-tab="accounts"><i aria-hidden="true"></i>Accounts</a>
    <a href="#/requests" data-tab="requests"><i aria-hidden="true"></i>Requests</a>
    <a href="#/usage" data-tab="usage"><i aria-hidden="true"></i>Usage</a>
    <a href="#/models" data-tab="models"><i aria-hidden="true"></i>Models</a>
    <a href="#/config" data-tab="config"><i aria-hidden="true"></i>Config</a>
  </nav>
  <div id="layer"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="banked-reset-modal" class="reset-modal" aria-labelledby="reset-modal-title" aria-describedby="reset-modal-account"></dialog>
</body>
</html>
